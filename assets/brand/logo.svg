<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="quantGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0df2c8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer subtle coordinate rings -->
  <circle cx="50" cy="50" r="44" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 4" />
  <circle cx="50" cy="50" r="36" stroke="#334155" stroke-width="0.75" />
  
  <!-- Central Syntropic Manifold glyph: Intersecting asymptotic hyperbola and alpha delta -->
  <path d="M 22 72 C 34 72, 38 56, 50 50 C 62 44, 66 28, 78 28" stroke="url(#quantGlow)" stroke-width="3" stroke-linecap="round" filter="url(#neonBlur)" />
  <path d="M 78 72 C 66 72, 62 56, 50 50 C 38 44, 34 28, 22 28" stroke="url(#quantGlow)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  
  <!-- Discrete eigenvalues / lattice nodes -->
  <circle cx="50" cy="50" r="3.5" fill="#0df2c8" filter="url(#neonBlur)" />
  <circle cx="22" cy="72" r="2.5" fill="#38bdf8" />
  <circle cx="78" cy="28" r="2.5" fill="#0df2c8" />
  <circle cx="78" cy="72" r="2" fill="#6366f1" />
  <circle cx="22" cy="28" r="2" fill="#6366f1" />
  
  <!-- Tangent vector arrow -->
  <line x1="50" y1="50" x2="68" y2="35" stroke="#0df2c8" stroke-width="1.2" stroke-dasharray="1.5 1.5" />
</svg>
